name: Publish to npm

# Publishes when a push to main or the beta branch (rewrite/v4) changes the package's code (src/, the type
# declarations) or package.json.
# Changes to docs or tests alone do not publish (the Test workflow still runs them).
#
# Versioning: if package.json holds a version that is not on npm yet (e.g. after
# `npm version minor --no-git-tag-version`), that version is published. Otherwise the
# patch version is bumped and the bump is committed back to main. Either way the
# release is tagged v<version>.
#
# Beta branch (rewrite/v4): versions are prereleases such as 4.0.0-beta.0, published under npm's `beta` dist-tag,
# so `npm install poker-rangeman` keeps installing the latest release from main. If package.json's prerelease is
# already on npm, the last number is bumped (4.0.0-beta.0 -> 4.0.0-beta.1) and committed back to the branch. A
# prerelease version is refused on main, and a release version on the beta branch.
#
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed, and npm attaches
# a provenance attestation. The trusted publisher on npmjs.com must name this file.
on:
  push:
    branches: [main, rewrite/v4]
    paths:
      - 'src/**'
      - 'index.d.ts'
      - 'core.d.ts'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write # commit the version bump and push the tag
  id-token: write # npm trusted publishing / provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Choose version
        id: version
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "rewrite/v4" ]; then
            NAME=$(node -p "require('./package.json').name")
            VERSION=$(node -p "require('./package.json').version")
            case "$VERSION" in
              *-*) ;;
              *) echo "::error::$BRANCH publishes prereleases only, but package.json has $VERSION"; exit 1 ;;
            esac
            BUMPED=false
            # Next prerelease number that is not on npm yet
            while npm view "$NAME@$VERSION" version > /dev/null 2>&1; do
              VERSION=$(node -e 'const v = process.argv[1]; const m = v.match(/^(.*?)(\d+)$/); console.log(m ? m[1] + (Number(m[2]) + 1) : v + ".0")' "$VERSION")
              BUMPED=true
            done
            if [ "$BUMPED" = "true" ]; then npm version "$VERSION" --no-git-tag-version > /dev/null; fi
            echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "dist_tag=beta" >> "$GITHUB_OUTPUT"
            echo "Publishing prerelease $VERSION under the beta tag"
            exit 0
          fi
          case "$(node -p "require('./package.json').version")" in
            *-*) echo "::error::main publishes releases only; package.json has a prerelease version"; exit 1 ;;
          esac
          echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          LATEST=$(npm view "$NAME" version 2>/dev/null || echo "0.0.0")
          # Is package.json's version newer than npm's latest? (major.minor.patch)
          NEWER=$(node -e '
            const [a, b] = process.argv.slice(1).map(v => v.split("-")[0].split(".").map(Number));
            const diff = a.map((n, i) => n - b[i]).find(d => d !== 0) || 0;
            console.log(diff > 0);
          ' "$VERSION" "$LATEST")
          if [ "$NEWER" = "true" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Publishing $VERSION from package.json (npm latest: $LATEST)"
          else
            # Not newer than npm: release the next patch after npm's latest
            npm version "$LATEST" --no-git-tag-version --allow-same-version > /dev/null
            npm version patch --no-git-tag-version > /dev/null
            VERSION=$(node -p "require('./package.json').version")
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Bumped to $VERSION (npm latest: $LATEST)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.version.outputs.bumped == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$VERSION"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Tag release
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish
        run: npm publish --tag "${{ steps.version.outputs.dist_tag }}"
