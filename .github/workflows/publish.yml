name: Publish to npm

# Runs on every push to main. Tests always run; the package is published only
# when the version in package.json is not on npm yet, so bump the version
# (e.g. `npm version minor`) in the commit you want released.
#
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed, and npm
# attaches a provenance attestation automatically. The trusted publisher on
# npmjs.com must name this workflow file: publish.yml
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the v<version> git tag after publishing
  id-token: write # npm trusted publishing / provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check whether this version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm; skipping publish. Bump the version in package.json to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish $NAME@$VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish

      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
