name: Publish to npm

# Publishes when a GitHub Release is published, or manually from the Actions tab.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed, and npm
# attaches a provenance attestation automatically. Configure the trusted
# publisher on npmjs.com (package settings) with workflow file "publish.yml".
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing / provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Package: $NAME@$VERSION"

          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$VERSION" ] && [ "$RELEASE_TAG" != "$VERSION" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$VERSION'"
            exit 1
          fi

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published. Bump the version in package.json first."
            exit 1
          fi

      - name: Publish
        run: npm publish
